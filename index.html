<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Gastos</title>
<style>
  :root{
    --bg:#0b0d10; --card:#151920; --card2:#1b202a; --txt:#f2f5f9; --mut:#8b96a8;
    --acc:#4ade80; --acc2:#22d3ee; --warn:#fbbf24; --bad:#f87171; --line:#242b36; --old:#a78bfa;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f5f7fa; --card:#fff; --card2:#eef2f7; --txt:#0d1117; --mut:#5a6472; --line:#e3e8ef;}
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{overflow-x:hidden}
  body{margin:0; background:var(--bg); color:var(--txt);
       font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
       padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom));}
  .wrap{max-width:560px; margin:0 auto; padding:14px 16px}
  h1{font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:var(--mut);
     margin:6px 0 14px; font-weight:600}
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px;
        padding:16px; margin-bottom:12px}
  .total{font-size:42px; font-weight:700; letter-spacing:-.02em; line-height:1.05}
  .row{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .mut{color:var(--mut); font-size:13px}
  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto; padding:8px 13px; border-radius:999px; background:var(--card2);
        border:1px solid var(--line); color:var(--mut); font-size:13px; font-weight:600;
        cursor:pointer; white-space:nowrap}
  .chip.on{background:var(--acc); color:#06210f; border-color:var(--acc)}
  .delta{font-size:13px; font-weight:600}
  .up{color:var(--bad)} .down{color:var(--acc)}
  .donut{display:flex; gap:16px; align-items:center}
  svg.d{width:120px; height:120px; flex:0 0 auto; transform:rotate(-90deg)}
  .legend{flex:1; min-width:0}
  .lg{display:flex; align-items:center; gap:8px; font-size:13px; padding:3px 0}
  .dot{width:9px; height:9px; border-radius:3px; flex:0 0 auto}
  .lg .n{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lg .v{color:var(--mut); font-variant-numeric:tabular-nums}
  .bar{height:8px; background:var(--card2); border-radius:99px; overflow:hidden; margin-top:6px}
  .bar i{display:block; height:100%; border-radius:99px}
  .bud{margin-bottom:13px; cursor:pointer}
  .bud:last-child{margin-bottom:0}
  .tx{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
  .tx:last-child{border-bottom:0}
  .tx .nm{font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
  .tx .am{font-variant-numeric:tabular-nums; font-weight:600; font-size:14.5px; flex:0 0 auto; text-align:right}
  .day{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); margin:16px 0 2px; font-weight:700}
  .tag{font-size:11px; color:var(--mut); background:var(--card2); border-radius:6px; padding:1px 6px; margin-left:6px}
  .tag.p{color:#3b2a00; background:var(--warn)}
  .alert{border-color:color-mix(in srgb,var(--warn) 55%,var(--line)); background:color-mix(in srgb,var(--warn) 10%,var(--card))}
  .alert.bad{border-color:color-mix(in srgb,var(--bad) 60%,var(--line)); background:color-mix(in srgb,var(--bad) 10%,var(--card))}
  .btn{border:0; border-radius:12px; padding:10px 16px; font:700 14px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif; cursor:pointer;
       background:var(--acc); color:#06210f}
  .btn.ghost{background:var(--card2); color:var(--txt); border:1px solid var(--line)}
  .hbar{display:grid; grid-template-columns:64px 1fr; gap:4px 10px; align-items:center; margin-bottom:10px}
  .hbar .lab{font-size:13px; color:var(--mut)}
  .hbar .bars{min-width:0}
  .hbar .b{height:9px; border-radius:99px; margin:3px 0}
  .hbar .val{font-size:12px; color:var(--mut); font-variant-numeric:tabular-nums}
  nav{position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:space-around;
      background:color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      border-top:1px solid var(--line); padding:8px 0 calc(8px + env(safe-area-inset-bottom)); z-index:5}
  nav button{background:none; border:0; color:var(--mut); font:600 11px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif; display:flex;
             flex-direction:column; align-items:center; gap:3px; padding:4px 8px; cursor:pointer; min-width:56px}
  nav button.on{color:var(--acc)}
  nav button span{font-size:19px}
  .fab{position:fixed; right:18px; bottom:calc(80px + env(safe-area-inset-bottom)); width:60px; height:60px;
       border-radius:50%; border:0; background:var(--acc); color:#06210f; font-size:34px; line-height:1;
       box-shadow:0 8px 24px rgba(0,0,0,.35); cursor:pointer; z-index:6}
  .sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:8}
  .sheet{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-radius:22px 22px 0 0;
         padding:18px 16px calc(18px + env(safe-area-inset-bottom)); z-index:9; max-width:560px; margin:0 auto;
         max-height:92vh; overflow-y:auto}
  .amt{display:flex; align-items:center; gap:8px; border-bottom:2px solid var(--acc); margin:6px 0 12px}
  .amt input{flex:1; min-width:0; border:0; background:none; color:var(--txt); font:700 40px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif; padding:4px 0; outline:none}
  .amt button{flex:0 0 auto}
  .note{width:100%; border:1px solid var(--line); background:var(--card2); color:var(--txt);
        border-radius:12px; padding:10px 12px; font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif; margin-bottom:12px}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .grid button{border:1px solid var(--line); background:var(--card2); color:var(--txt); border-radius:14px;
               padding:12px 4px; font:600 13px/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif; cursor:pointer; min-height:56px}
  .grid button b{display:block; font-size:20px; margin-bottom:2px}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(150px + env(safe-area-inset-bottom));
         background:var(--txt); color:var(--bg); padding:10px 16px; border-radius:12px; font-weight:600; font-size:14px; z-index:10}
  .lock{position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:14px; z-index:20; padding:24px}
  .lock h2{margin:0; font-size:18px}
  .lock input{width:180px; text-align:center; letter-spacing:.5em; font-size:24px; padding:12px;
              border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--txt)}
  .err{color:var(--bad); font-size:13px; min-height:18px}
  .hide{display:none !important}
</style>
</head>
<body>

<div class="lock" id="lock">
  <h2>🔒 Gastos</h2>
  <div class="mut">Introduce tu PIN</div>
  <input id="pin" type="tel" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••" aria-label="PIN">
  <button class="btn" onclick="unlock()">Entrar</button>
  <div class="err" id="err" role="alert"></div>
</div>

<main class="wrap hide" id="app">
  <h1>Gastos · <span id="stamp"></span></h1>
  <div id="sync"></div>
  <div class="chips" id="chips"></div>
  <div id="view"></div>
</main>

<button class="fab hide" id="fab" aria-label="Añadir gasto" onclick="openAdd()">+</button>

<nav class="hide" id="nav">
  <button data-t="mes" class="on"><span>◔</span>Mes</button>
  <button data-t="sem"><span>◎</span>Semana</button>
  <button data-t="his"><span>▥</span>Historial</button>
  <button data-t="mov"><span>≡</span>Movimientos</button>
</nav>

<div id="sheet"></div>

<script>
const COLORS = ['#4ade80','#22d3ee','#a78bfa','#fbbf24','#f472b6','#60a5fa','#fb923c','#34d399','#f87171','#94a3b8'];
const ICON = {'Comida fuera':'🍽️','Supermercado':'🛒','Transporte':'🚇','Ocio':'🎟️','Ropa':'👕','Viajes':'✈️',
  'Tecnología':'💻','Deporte':'🏋️','Salud':'💊','Hogar':'🏠','Suscripciones':'🔁','Belleza':'✂️','Educación':'📚',
  'Compras':'🛍️','Regalos':'🎁','Sin categorizar':'•'};
let DATA = null, BASE = null, MES = null, TAB = 'mes', CUR = 'EUR';

const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n||0);
const eur0 = n => new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);
const fmtD = s => new Date(s+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'});
const fmtM = s => new Date(s+'-15T12:00:00').toLocaleDateString('es-ES',{month:'long',year:'numeric'});
const shortM = s => { const n=new Date(s+'-15T12:00:00').toLocaleDateString('es-ES',{month:'short',year:'2-digit'}); return n.replace('.',''); };
const ls = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
             set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };

/* ---------- desbloqueo ---------- */
async function unlock(){
  const pin = document.getElementById('pin').value.trim();
  if(pin.length < 4) return setErr('PIN incompleto');
  try{
    const enc = await (await fetch('data.enc.json',{cache:'no-store'})).json();
    const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(enc.salt), iterations:210000, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(enc.iv)}, key, b64(enc.ct));
    BASE = JSON.parse(new TextDecoder().decode(plain));
    try{ localStorage.setItem('panel_pin', pin); }catch(e){}
    start();
  }catch(e){ setErr(navigator.onLine ? 'PIN incorrecto' : 'Sin conexión y sin copia guardada'); }
}
function setErr(m){ document.getElementById('err').textContent = m; }

/* ---------- gastos añadidos en el móvil (pendientes) ---------- */
function pending(){ return ls.get('pendientes', []); }
function savePending(p){ ls.set('pendientes', p); }
function merge(){
  // quita los pendientes que ya llegaron al ledger (id app-xxxx) y los suma a los datos
  const ids = new Set(BASE.tx.map(t=>t.i));
  const p = pending().filter(x=>!ids.has('app-'+x.uid));
  savePending(p);
  DATA = JSON.parse(JSON.stringify(BASE));
  p.forEach(x=>{
    const t = {d:x.d, h:x.h, a:x.cur==='EUR'?x.a:Math.round(x.a/BASE.fx*100)/100, cur:x.cur, orig:x.a,
               m:x.m||x.c, c:x.c, o:'Manual', i:'app-'+x.uid, pend:true};
    DATA.tx.push(t);
    const k = t.d.slice(0,7);
    const m = DATA.months[k] || (DATA.months[k] = {total:0,n:0,cat:{},big:[],merch:[]});
    m.total = Math.round((m.total+t.a)*100)/100; m.n++;
    m.cat[t.c] = Math.round(((m.cat[t.c]||0)+t.a)*100)/100;
    const mm = m.merch.find(r=>r[0]===t.m); if(mm){mm[1]+=t.a;mm[2]++;} else m.merch.push([t.m,t.a,1]);
    if(t.a>=50) m.big.push({d:t.d,m:t.m,a:t.a});
  });
  DATA.tx.sort((a,b)=>(a.d+a.h).localeCompare(b.d+b.h));
  DATA.months = Object.fromEntries(Object.entries(DATA.months).sort());
}

function start(){
  document.getElementById('lock').classList.add('hide');
  ['app','nav','fab'].forEach(id=>document.getElementById(id).classList.remove('hide'));
  document.getElementById('stamp').textContent = fmtM(todayISO().slice(0,7));
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
    TAB=b.dataset.t; document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b)); render();
  });
  refresh();
}
function refresh(){
  merge();
  const months = Object.keys(DATA.months);
  if(!MES || !DATA.months[MES]) MES = months[months.length-1];
  renderChips(); renderSync(); render();
}
function renderChips(){
  const months = Object.keys(DATA.months);
  const el = document.getElementById('chips');
  el.classList.toggle('hide', TAB==='his');
  el.innerHTML = months.slice(-6).reverse().map(m=>{
    const nm = new Date(m+'-15T12:00:00').toLocaleDateString('es-ES',{month:'short'}).replace('.','');
    return `<div class="chip ${m===MES?'on':''}" data-m="${m}">${nm.charAt(0).toUpperCase()+nm.slice(1)} · ${eur0(DATA.months[m].total)}</div>`;
  }).join('');
  el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ MES=c.dataset.m; renderChips(); render(); });
}
function renderSync(){
  const p = pending(), el = document.getElementById('sync');
  if(!p.length){ el.innerHTML=''; return; }
  const sinEnviar = p.filter(x=>!x.sent).length;
  el.innerHTML = `<div class="card alert"><div class="row" style="align-items:center">
    <div><b>${p.length} gasto${p.length>1?'s':''} del móvil</b><div class="mut">${sinEnviar?`${sinEnviar} sin enviar al PC`:'Enviados · entran en la próxima actualización'}</div></div>
    <button class="btn" onclick="sendPending()">${sinEnviar?'Enviar':'Reenviar'}</button></div></div>`;
}

/* ---------- añadir gasto (toque 1: +, escribe importe, toque 2: categoría) ---------- */
function catOrder(){
  const cnt = {};
  DATA.tx.slice(-200).forEach(t=>cnt[t.c]=(cnt[t.c]||0)+1);
  const all = Object.keys(DATA.budgets).filter(c=>DATA.budgets[c]>0);
  Object.keys(cnt).forEach(c=>{ if(!all.includes(c) && !['Ingreso','Ahorro','Transferencias'].includes(c)) all.push(c); });
  return all.sort((a,b)=>(a==='Sin categorizar')-(b==='Sin categorizar') || (cnt[b]||0)-(cnt[a]||0)).slice(0,12);
}
function openAdd(){
  CUR = ls.get('ultima_moneda','EUR');
  document.getElementById('sheet').innerHTML = `
    <div class="sheet-bg" onclick="closeAdd()"></div>
    <div class="sheet" role="dialog" aria-label="Añadir gasto">
      <div class="row"><b>Nuevo gasto</b><button class="btn ghost" onclick="closeAdd()" aria-label="Cerrar">✕</button></div>
      <div class="amt"><input id="amt" type="text" inputmode="decimal" placeholder="0,00" aria-label="Importe" autocomplete="off">
        <button class="btn ghost" id="curb" onclick="toggleCur()">${CUR}</button></div>
      <input class="note" id="note" placeholder="Dónde (opcional)" aria-label="Comercio o nota" autocomplete="off">
      <div class="mut" style="margin-bottom:8px">Toca la categoría para guardar</div>
      <div class="grid">${catOrder().map(c=>`<button data-c="${esc(c)}" onclick="saveAdd(this.dataset.c)"><b>${ICON[c]||'•'}</b>${esc(c)}</button>`).join('')}</div>
    </div>`;
  document.getElementById('amt').focus();  // síncrono: iOS solo abre el teclado dentro del toque
}
function closeAdd(){ document.getElementById('sheet').innerHTML=''; }
function toggleCur(){ CUR = CUR==='EUR'?'COP':'EUR'; document.getElementById('curb').textContent=CUR; }
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function saveAdd(cat){
  const raw = document.getElementById('amt').value.replace(/\s/g,'');
  const a = parseFloat(CUR==='COP' ? raw.replace(/\./g,'').replace(',','.') : raw.replace(',','.'));
  if(!(a>0)){ document.getElementById('amt').focus(); return toast('Escribe el importe'); }
  const now = new Date();
  const p = pending();
  p.push({uid: Date.now().toString(36)+Math.random().toString(36).slice(2,6), d: todayISO(),
          h: now.toTimeString().slice(0,5), a: Math.round(a*100)/100, cur: CUR, c: cat,
          m: document.getElementById('note').value.trim().replace(/;/g,','), sent:false});
  savePending(p); ls.set('ultima_moneda', CUR);
  closeAdd(); MES = todayISO().slice(0,7); refresh();
  toast(`Guardado: ${CUR==='EUR'?eur(a):new Intl.NumberFormat('es-ES').format(a)+' COP'} · ${cat}`);
}
function sendPending(){
  const p = pending();
  const body = 'Gastos añadidos desde la app (no editar):\n' +
    p.map(x=>[x.d,x.h,x.a,x.cur,x.c,x.m,x.uid].join(';')).join('\n');
  location.href = `mailto:${encodeURIComponent(DATA.inbox||'')}?subject=${encodeURIComponent('GASTOS-APP '+todayISO())}&body=${encodeURIComponent(body)}`;
  p.forEach(x=>x.sent=true); savePending(p); renderSync();
}

/* ---------- presupuestos ---------- */
function budgets(){ return Object.assign({}, DATA.budgets, ls.get('presupuestos', {})); }
function editBudget(c){
  const cur = budgets()[c]||0;
  const v = prompt(`Presupuesto mensual para ${c} (€)`, cur);
  if(v==null) return;
  const n = parseFloat(v.replace(',','.'));
  if(!(n>=0)) return;
  const o = ls.get('presupuestos', {}); o[c]=n; ls.set('presupuestos', o); render();
}

/* ---------- vistas ---------- */
function weekRange(){
  const t = new Date(todayISO()+'T12:00:00');
  const back = (t.getDay() - 2 + 7) % 7;
  const end = new Date(t); end.setDate(t.getDate() - back);
  const start = new Date(end); start.setDate(end.getDate() - 5);
  const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  return [iso(start), iso(end)];
}
function donut(cat){
  const tot = Object.values(cat).reduce((a,b)=>a+b,0);
  if(!tot) return '<div class="mut" style="width:120px;text-align:center">sin datos</div>';
  let acc = 0, segs = '';
  Object.keys(cat).sort((a,b)=>cat[b]-cat[a]).forEach((k,i)=>{
    const p = cat[k]/tot*100;
    segs += `<circle r="15.9" cx="21" cy="21" fill="none" stroke="${COLORS[i%COLORS.length]}" stroke-width="6"
      stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-acc}" pathLength="100"></circle>`;
    acc += p;
  });
  return `<svg class="d" viewBox="0 0 42 42" aria-hidden="true"><circle r="15.9" cx="21" cy="21" fill="none" stroke="var(--card2)" stroke-width="6"></circle>${segs}</svg>`;
}
function render(){
  document.getElementById('chips').classList.toggle('hide', TAB==='his');
  const box = document.getElementById('view');
  box.innerHTML = TAB==='mes'?viewMes() : TAB==='sem'?viewSemana() : TAB==='his'?viewHist() : viewMovs();
}

function viewMes(){
  const m = DATA.months[MES];
  const keys = Object.keys(DATA.months);
  const prev = keys[keys.indexOf(MES)-1];
  const isCur = MES === todayISO().slice(0,7);
  const dayN = isCur ? +todayISO().slice(8,10) : 31;
  // comparación justa: mismo número de días del mes anterior
  const prevTx = prev ? DATA.tx.filter(t=>t.d.startsWith(prev) && +t.d.slice(8,10)<=dayN) : [];
  const prevSame = prevTx.reduce((s,t)=>s+t.a,0);
  const prevTotal = prev ? DATA.months[prev].total : 0;
  const d = prevSame ? (m.total-prevSame)/prevSame*100 : 0;
  const days = new Date(+MES.slice(0,4), +MES.slice(5,7), 0).getDate();
  const elapsed = isCur ? dayN : days;
  const cats = Object.keys(m.cat).sort((a,b)=>m.cat[b]-m.cat[a]);
  const total = m.total || 1;
  const B = budgets();
  const budCats = [...new Set([...cats, ...Object.keys(B)])].filter(c=>B[c]>0 || (m.cat[c]||0)>0)
     .filter(c=>!['Ingreso','Ahorro','Transferencias'].includes(c));
  const rows = budCats.map(c=>({c, used:m.cat[c]||0, lim:B[c]||0, pct: B[c] ? (m.cat[c]||0)/B[c]*100 : null}))
     .sort((a,b)=>(b.pct??-1)-(a.pct??-1));
  const alerts = rows.filter(r=>r.pct!=null && r.pct>=80);
  const totBud = rows.reduce((s,r)=>s+r.lim,0);
  // categorías por diferencia con el mes anterior
  const pc = prev ? DATA.months[prev].cat : {};
  const diffs = [...new Set([...cats, ...Object.keys(pc)])].map(c=>[c,(m.cat[c]||0)-(pc[c]||0)])
     .filter(x=>Math.abs(x[1])>=5).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,4);

  return `
  ${alerts.length?`<div class="card alert ${alerts.some(a=>a.pct>=100)?'bad':''}" role="status">
     <b>⚠ ${alerts.length} categoría${alerts.length>1?'s':''} al ${alerts.length>1?'80 % o más':Math.round(alerts[0].pct)+' %'}</b>
     <div class="mut" style="margin-top:4px">${alerts.map(a=>`${esc(a.c)} ${Math.round(a.pct)} % (${eur0(a.used)} de ${eur0(a.lim)})`).join(' · ')}</div></div>`:''}
  <div class="card">
    <div class="mut">Gastado en ${fmtM(MES)}</div>
    <div class="total">${eur(m.total)}</div>
    <div class="row" style="margin-top:6px">
      <div class="mut">${m.n} movimientos · ${eur0(m.total/elapsed)}/día</div>
      ${prevSame?`<div class="delta ${d>0?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d).toFixed(0)}%</div>`:''}
    </div>
    ${prev?`<div class="mut" style="margin-top:8px">${isCur?`A día ${dayN} de ${fmtM(prev).split(' ')[0]} llevabas ${eur0(prevSame)} (total del mes: ${eur0(prevTotal)})`
      :`${fmtM(prev).split(' ')[0].replace(/^./,c=>c.toUpperCase())}: ${eur0(prevTotal)}`}</div>`:''}
    ${diffs.length?`<div class="mut" style="margin-top:6px">${diffs.map(([c,v])=>`<span class="${v>0?'up':'down'}">${v>0?'+':'−'}${eur0(Math.abs(v))}</span> ${esc(c)}`).join(' · ')}</div>`:''}
  </div>
  <div class="card">
    <div class="row" style="margin-bottom:12px"><b>Presupuesto</b><span class="mut">${eur0(m.total)} de ${eur0(totBud)} · toca para editar</span></div>
    ${rows.map(r=>{
      const pct = r.pct==null?100:Math.min(r.pct,100);
      const col = r.pct==null?'var(--mut)': r.pct>=100?'var(--bad)': r.pct>=80?'var(--warn)':'var(--acc)';
      return `<div class="bud" data-c="${esc(r.c)}" onclick="editBudget(this.dataset.c)"><div class="row"><div>${ICON[r.c]||'•'} ${esc(r.c)}</div>
        <div class="mut">${eur0(r.used)} <span style="opacity:.7">/ ${r.lim?eur0(r.lim):'sin límite'}</span></div></div>
        <div class="bar" role="progressbar" aria-label="${esc(r.c)}" aria-valuenow="${Math.round(r.pct??0)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%;background:${col}"></i></div></div>`;
    }).join('')}
  </div>
  <div class="card">
    <div class="row" style="margin-bottom:12px"><b>Por categoría</b><span class="mut">${cats.length}</span></div>
    <div class="donut">${donut(m.cat)}
      <div class="legend">${cats.slice(0,7).map((c,i)=>`
        <div class="lg"><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>
        <span class="n">${esc(c)}</span><span class="v">${Math.round(m.cat[c]/total*100)}%</span></div>`).join('')}</div>
    </div>
  </div>
  ${(m.merch||[]).length?`<div class="card"><div class="row" style="margin-bottom:6px"><b>Por comercio</b><span class="mut">top ${Math.min(8,m.merch.length)}</span></div>
     ${m.merch.slice().sort((a,b)=>b[1]-a[1]).slice(0,8).map(r=>`<div class="tx"><div class="nm">${esc(r[0])}<span class="tag">${r[2]}×</span></div><div class="am">${eur(r[1])}</div></div>`).join('')}</div>`:''}
  ${m.big.length?`<div class="card"><div class="row" style="margin-bottom:8px"><b>Compras grandes</b><span class="mut">≥50 €</span></div>
     ${m.big.map(b=>`<div class="tx"><div class="nm">${esc(b.m)}</div><div class="am">${eur(b.a)}</div></div>`).join('')}</div>`:''}
  <div class="mut" style="text-align:center;font-size:11px;margin:18px 0">
    Datos del ${new Date(BASE.generated).toLocaleString('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}${navigator.onLine?'':' · sin conexión'}
  </div>`;
}

function viewSemana(){
  const [a,b] = weekRange();
  const tx = DATA.tx.filter(t=>t.d>=a && t.d<=b);
  const small = tx.filter(t=>t.a<50), big = tx.filter(t=>t.a>=50);
  const tot = small.reduce((s,t)=>s+t.a,0);
  const days = Math.max(1,(new Date(b)-new Date(a))/864e5+1);
  const byCat = {}; small.forEach(t=>byCat[t.c]=(byCat[t.c]||0)+t.a);
  const cats = Object.keys(byCat).sort((x,y)=>byCat[y]-byCat[x]);
  return `
  <div class="card"><div class="mut">Gasto corriente · ${a} → ${b}</div>
    <div class="total">${eur(tot)}</div>
    <div class="row" style="margin-top:6px"><div class="mut">${small.length} mov · sin compras ≥50 €</div><div class="mut">${eur(tot/days)}/día</div></div></div>
  <div class="card"><div class="row" style="margin-bottom:12px"><b>Reparto</b></div>
    <div class="donut">${donut(byCat)}<div class="legend">${cats.slice(0,7).map((c,i)=>`
      <div class="lg"><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>
      <span class="n">${esc(c)}</span><span class="v">${eur0(byCat[c])}</span></div>`).join('')}</div></div></div>
  ${big.length?`<div class="card"><div class="row" style="margin-bottom:8px"><b>Fuera del cómputo</b><span class="mut">≥50 €</span></div>
    ${big.map(x=>`<div class="tx"><div class="nm">${esc(x.m)}</div><div class="am">${eur(x.a)}</div></div>`).join('')}</div>`:''}
  <div class="card"><div class="row" style="margin-bottom:4px"><b>Día a día</b></div>
    ${[...new Set(tx.map(t=>t.d))].map(d=>`
      <div class="day">${fmtD(d)} · ${eur(tx.filter(t=>t.d===d).reduce((s,t)=>s+t.a,0))}</div>
      ${tx.filter(t=>t.d===d).map(txRow).join('')}`).join('')}</div>`;
}

function viewHist(){
  // meses de la app (Global66 + manual) y resúmenes de Buddy, juntos
  const app = DATA.months, bud = Object.fromEntries((DATA.buddy||[]).map(b=>[b.m,b]));
  const all = [...new Set([...Object.keys(app), ...Object.keys(bud)])].sort().reverse();
  const max = Math.max(1, ...all.map(k=>Math.max(app[k]?.total||0, bud[k]?.eur||0)));
  const fx = new Intl.NumberFormat('es-ES').format(Math.round(DATA.fx));
  const budTot = (DATA.buddy||[]).reduce((s,b)=>s+b.eur,0);
  return `
  <div class="card">
    <div class="mut">Historial · ${all.length} meses</div>
    <div class="row" style="margin-top:8px;flex-wrap:wrap">
      <span class="mut"><span class="dot" style="display:inline-block;background:var(--acc)"></span> Esta app (movimiento a movimiento)</span>
      <span class="mut"><span class="dot" style="display:inline-block;background:var(--old)"></span> Buddy (solo total mensual)</span>
    </div>
  </div>
  <div class="card">
    ${all.map(k=>{
      const a = app[k], b = bud[k];
      return `<div class="hbar"><div class="lab">${shortM(k)}</div><div class="bars">
        ${a?`<div class="b" style="width:${a.total/max*100}%;background:var(--acc)"></div>`:''}
        ${b?`<div class="b" style="width:${b.eur/max*100}%;background:var(--old)"></div>`:''}
        <div class="val">${a?eur0(a.total):''}${a&&b?' · ':''}${b?`Buddy ${eur0(b.eur)}${b.cur==='COP'?` <span title="convertido">(${new Intl.NumberFormat('es-ES').format(b.orig)} COP)</span>`:''}`:''}</div>
        ${b&&b.cat.length?`<div class="val" style="opacity:.8">${b.cat.slice(0,3).map(c=>`${esc(c[0])} ${eur0(c[1])}`).join(' · ')}</div>`:''}
      </div></div>`;}).join('')}
  </div>
  <div class="card mut">Buddy: ${(DATA.buddy||[]).length} meses, ${eur0(budTot)} en total. Los meses en pesos se pasaron a euros al cambio de hoy (1 € = ${fx} COP), así que son aproximados. Desde septiembre, Buddy y esta app se solapan: Buddy incluye alquiler y pagos fuera de Global66.</div>`;
}

function txRow(t){
  return `<div class="tx"><div class="nm">${esc(t.m)}<span class="tag">${esc(t.c)}</span>${t.pend?'<span class="tag p">móvil</span>':''}</div>
    <div class="am">${eur(t.a)}${t.cur!=='EUR'?`<span class="mut" style="font-weight:400;font-size:11px"><br>${new Intl.NumberFormat('es-ES').format(t.orig)} ${t.cur}</span>`:''}</div></div>`;
}
function viewMovs(){
  const rows = DATA.tx.slice().reverse().slice(0,150);
  const days = [...new Set(rows.map(t=>t.d))];
  return `<div class="card"><div class="row" style="margin-bottom:4px"><b>Últimos movimientos</b><span class="mut">${rows.length}</span></div>
    ${days.map(d=>`<div class="day">${fmtD(d)}</div>${rows.filter(t=>t.d===d).map(txRow).join('')}`).join('')}</div>`;
}

/* ---------- arranque ---------- */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('load', ()=>{
  let p = null; try{ p = localStorage.getItem('panel_pin'); }catch(e){}
  if(p){ document.getElementById('pin').value = p; unlock(); }
});
document.getElementById('pin').addEventListener('keydown', e=>{ if(e.key==='Enter') unlock(); });
</script>
